# On-prem stack: API image built from packages/ (docker/Dockerfile.onprem), not fleetbase/fleetbase-api:latest.
x-fleetbase-api-common: &fleetbase-api-common
  image: fleetbase-api-onprem:local
  volumes:
    - ./api/.env:/fleetbase/api/.env
    - ./api/public:/fleetbase/api/public
    - ./api/storage/app:/fleetbase/api/storage/app
    - ./packages:/fleetbase/packages

services:
  cache:
    image: redis:4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mysql:8.0-oracle
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/"
      - "./docker/database/mysql:/var/lib/mysql"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "fleetbase"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OSRM routing engine (requires map data — run scripts/setup-osrm.ps1 first).
  osrm-backend:
    image: osrm/osrm-backend
    platform: linux/amd64
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "ch", "/data/map.osrm"]
    volumes:
      - ./docker/osrm/data:/data
    expose:
      - "5000"

  # CORS proxy so the React app on localhost can call OSRM from the browser.
  osrm:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./docker/osrm/nginx-cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5000:80"
    depends_on:
      - osrm-backend

  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "38000:8000"
    environment:
      SOCKETCLUSTER_WORKERS: 10
      SOCKETCLUSTER_BROKERS: 10

  # Leaflet basemap — TileServer GL URL shape; proxies OSM tiles for local dev (port 8080).
  tiles:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/tiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  scheduler:
    <<: *fleetbase-api-common
    command: ["go-crond", "--verbose", "root:./crontab"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: redis://cache:6379/0
      REDIS_URL: redis://cache:6379/0
      TELEMETRY_DISABLED: "true"
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
    depends_on:
      application:
        condition: service_started
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

  queue:
    <<: *fleetbase-api-common
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90", "--max-jobs=1000", "--max-time=3600"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "for pid in $$(pidof php 2>/dev/null); do tr '\\0' ' ' </proc/$$pid/cmdline | grep -q 'artisan queue:work' && exit 0; done; exit 1",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
    environment:
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: redis://cache:6379/0
      REDIS_URL: redis://cache:6379/0
      TELEMETRY_DISABLED: "true"
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
    depends_on:
      application:
        condition: service_started
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Shipgen React console — nginx serves dist + proxies API/socket to gateway.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: shipgen-frontend:local
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_started
      socket:
        condition: service_started

  # Phase 0 API gateway — public :8000; path routing + session introspection for domain APIs.
  gateway:
    build:
      context: ./docker/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-shipgen-gateway-dev-secret}
      GATEWAY_AUTH_CACHE_ENABLED: ${GATEWAY_AUTH_CACHE_ENABLED:-0}
    depends_on:
      iam-service:
        condition: service_started
      fleetops-service:
        condition: service_started
      pallet-service:
        condition: service_started
      ledger-service:
        condition: service_started
      storefront-service:
        condition: service_started
      yms-service:
        condition: service_started
      pms-service:
        condition: service_started
      application:
        condition: service_started

  # Phase 1 — IAM slice (core-api internal routes only; shared DB + Redis sessions).
  iam-service:
    <<: *fleetbase-api-common
    restart: unless-stopped
    environment:
      FLEETBASE_SERVICE: iam
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: redis://cache:6379/0
      REDIS_URL: redis://cache:6379/0
      REDIS_HOST: cache
      SESSION_DRIVER: redis
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: Shipgen
      MAIL_SALES_ADDRESS: sales@shipgen.net
      MAIL_SUPPORT_ADDRESS: support@shipgen.net
      MAIL_NOREPLY_ADDRESS: noreply@shipgen.net
      MAIL_BILLING_ADDRESS: billing@shipgen.net
      APP_NAME: shipgen-fleet-iam
      LOG_CHANNEL: daily
      TELEMETRY_DISABLED: "true"
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      CONSOLE_HOST: http://localhost:5173
      FRONTEND_HOSTS: http://localhost:5173,http://localhost:8000
      ASSET_PUBLIC_BASE_URL: http://localhost:8000
      FLEETBASE_ASSETS_S3_BUCKET: ""
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-shipgen-gateway-dev-secret}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-shipgen-jwt-dev-secret-change-in-prod}
      GATEWAY_JWT_ISSUER: shipgen-iam
      GATEWAY_JWT_AUDIENCE: shipgen-internal
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Phase 2 — FleetOps slice (fleet-ops routes; trusts gateway internal JWT).
  fleetops-service:
    <<: *fleetbase-api-common
    restart: unless-stopped
    environment:
      FLEETBASE_SERVICE: fleetops
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: redis://cache:6379/0
      REDIS_URL: redis://cache:6379/0
      REDIS_HOST: cache
      SESSION_DRIVER: redis
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: Shipgen
      MAIL_SALES_ADDRESS: sales@shipgen.net
      MAIL_SUPPORT_ADDRESS: support@shipgen.net
      MAIL_NOREPLY_ADDRESS: noreply@shipgen.net
      MAIL_BILLING_ADDRESS: billing@shipgen.net
      APP_NAME: shipgen-fleet-ops
      LOG_CHANNEL: daily
      TELEMETRY_DISABLED: "true"
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      CONSOLE_HOST: http://localhost:5173
      FRONTEND_HOSTS: http://localhost:5173,http://localhost:8000
      OSRM_HOST: http://osrm-backend:5000
      MAP_TILE_URL: http://localhost:8080/styles/basic/{z}/{x}/{y}.png
      MAP_TILE_URL_DARK: http://localhost:8080/styles/basic/{z}/{x}/{y}.png
      ASSET_PUBLIC_BASE_URL: http://localhost:8000
      FLEETBASE_ASSETS_S3_BUCKET: ""
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-shipgen-jwt-dev-secret-change-in-prod}
      GATEWAY_JWT_ISSUER: shipgen-iam
      GATEWAY_JWT_AUDIENCE: shipgen-internal
      GATEWAY_TRUST_INTERNAL_JWT: "true"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      osrm-backend:
        condition: service_started

  # Phase 3 — Pallet / WMS slice (pallet routes; trusts gateway internal JWT).
  pallet-service:
    <<: *fleetbase-api-common
    restart: unless-stopped
    environment:
      FLEETBASE_SERVICE: pallet
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: redis://cache:6379/0
      REDIS_URL: redis://cache:6379/0
      REDIS_HOST: cache
      SESSION_DRIVER: redis
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: Shipgen
      MAIL_SALES_ADDRESS: sales@shipgen.net
      MAIL_SUPPORT_ADDRESS: support@shipgen.net
      MAIL_NOREPLY_ADDRESS: noreply@shipgen.net
      MAIL_BILLING_ADDRESS: billing@shipgen.net
      APP_NAME: shipgen-fleet-pallet
      LOG_CHANNEL: daily
      TELEMETRY_DISABLED: "true"
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      CONSOLE_HOST: http://localhost:5173
      FRONTEND_HOSTS: http://localhost:5173,http://localhost:8000
      ASSET_PUBLIC_BASE_URL: http://localhost:8000
      FLEETBASE_ASSETS_S3_BUCKET: ""
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-shipgen-jwt-dev-secret-change-in-prod}
      GATEWAY_JWT_ISSUER: shipgen-iam
      GATEWAY_JWT_AUDIENCE: shipgen-internal
      GATEWAY_TRUST_INTERNAL_JWT: "true"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Phase 3 — Ledger (billing, invoices, payments).
  ledger-service:
    <<: *fleetbase-api-common
    restart: unless-stopped
    environment:
      FLEETBASE_SERVICE: ledger
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: redis://cache:6379/0
      REDIS_URL: redis://cache:6379/0
      REDIS_HOST: cache
      SESSION_DRIVER: redis
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: Shipgen
      MAIL_SALES_ADDRESS: sales@shipgen.net
      MAIL_SUPPORT_ADDRESS: support@shipgen.net
      MAIL_NOREPLY_ADDRESS: noreply@shipgen.net
      MAIL_BILLING_ADDRESS: billing@shipgen.net
      APP_NAME: shipgen-fleet-ledger
      LOG_CHANNEL: daily
      TELEMETRY_DISABLED: "true"
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      CONSOLE_HOST: http://localhost:5173
      FRONTEND_HOSTS: http://localhost:5173,http://localhost:8000
      ASSET_PUBLIC_BASE_URL: http://localhost:8000
      FLEETBASE_ASSETS_S3_BUCKET: ""
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-shipgen-jwt-dev-secret-change-in-prod}
      GATEWAY_JWT_ISSUER: shipgen-iam
      GATEWAY_JWT_AUDIENCE: shipgen-internal
      GATEWAY_TRUST_INTERNAL_JWT: "true"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Phase 3 — Storefront (e-commerce / networks).
  storefront-service:
    <<: *fleetbase-api-common
    restart: unless-stopped
    environment:
      FLEETBASE_SERVICE: storefront
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: redis://cache:6379/0
      REDIS_URL: redis://cache:6379/0
      REDIS_HOST: cache
      SESSION_DRIVER: redis
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: Shipgen
      MAIL_SALES_ADDRESS: sales@shipgen.net
      MAIL_SUPPORT_ADDRESS: support@shipgen.net
      MAIL_NOREPLY_ADDRESS: noreply@shipgen.net
      MAIL_BILLING_ADDRESS: billing@shipgen.net
      APP_NAME: shipgen-fleet-storefront
      LOG_CHANNEL: daily
      TELEMETRY_DISABLED: "true"
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      CONSOLE_HOST: http://localhost:5173
      FRONTEND_HOSTS: http://localhost:5173,http://localhost:8000
      ASSET_PUBLIC_BASE_URL: http://localhost:8000
      FLEETBASE_ASSETS_S3_BUCKET: ""
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-shipgen-jwt-dev-secret-change-in-prod}
      GATEWAY_JWT_ISSUER: shipgen-iam
      GATEWAY_JWT_AUDIENCE: shipgen-internal
      GATEWAY_TRUST_INTERNAL_JWT: "true"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

  application:
    <<: *fleetbase-api-common
    build:
      context: .
      dockerfile: docker/Dockerfile.onprem
      target: app-dev
    restart: unless-stopped
    environment:
      FLEETBASE_SERVICE: monolith
      ENVIRONMENT: development
      DATABASE_URL: "mysql://root@database/fleetbase"
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: redis://cache:6379/0
      REDIS_URL: redis://cache:6379/0
      REDIS_HOST: cache
      SESSION_DRIVER: redis
      SESSION_DOMAIN: localhost
      BROADCAST_DRIVER: socketcluster
      MAIL_FROM_NAME: Shipgen
      MAIL_SALES_ADDRESS: sales@shipgen.net
      MAIL_SUPPORT_ADDRESS: support@shipgen.net
      MAIL_NOREPLY_ADDRESS: noreply@shipgen.net
      MAIL_BILLING_ADDRESS: billing@shipgen.net
      APP_NAME: shipgen-fleet
      LOG_CHANNEL: daily
      TELEMETRY_DISABLED: "true"
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"
      CONSOLE_HOST: http://localhost:5173
      FRONTEND_HOSTS: http://localhost:5173,http://localhost:8000
      OSRM_HOST: http://osrm-backend:5000
      MAP_TILE_URL: http://localhost:8080/styles/basic/{z}/{x}/{y}.png
      MAP_TILE_URL_DARK: http://localhost:8080/styles/basic/{z}/{x}/{y}.png
      ASSET_PUBLIC_BASE_URL: http://localhost:8000
      FLEETBASE_ASSETS_S3_BUCKET: ""
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-shipgen-gateway-dev-secret}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-shipgen-jwt-dev-secret-change-in-prod}
      GATEWAY_JWT_ISSUER: shipgen-iam
      GATEWAY_JWT_AUDIENCE: shipgen-internal
      GATEWAY_TRUST_INTERNAL_JWT: "false"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      osrm-backend:
        condition: service_started

  # YMS (Yard Management) — FastAPI + PostgreSQL; proxied at /api/yms via gateway.
  yms-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: smart_yard
      POSTGRES_USER: smart_yard_user
      POSTGRES_PASSWORD: postgress
    volumes:
      - yms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_yard_user -d smart_yard"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 5s

  yms-service:
    build:
      context: ./yms/backend
    restart: unless-stopped
    env_file:
      - ./yms/.env
    environment:
      DATABASE_URL: postgresql://smart_yard_user:postgress@yms-postgres:5432/smart_yard
      CORS_ORIGINS: http://localhost:5173,http://localhost:8000,http://localhost:3001
      JWT_SECRET_KEY: ${YMS_JWT_SECRET_KEY:-gQLNBbn3YuZZloUuSx_W6h0g5GJeUKk8Kgi6qKwbvgY_-MF0-LmnqNH70WwswdcV}
      ENABLE_DEV_ROLE_OVERRIDE: ${YMS_ENABLE_DEV_ROLE_OVERRIDE:-false}
      PLATFORM_USERINFO_URL: http://iam-service:8000/int/v1/users/me
      NODE_ENV: development
    expose:
      - "8000"
    depends_on:
      yms-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  # PMS (Parking Management) — FastAPI + PostgreSQL; proxied at /api/pms via gateway.
  pms-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: parkflow
      POSTGRES_USER: pms_user
      POSTGRES_PASSWORD: pms_pass
    volumes:
      - pms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_user -d parkflow"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 5s

  pms-service:
    build:
      context: "./Parking management/backend"
    restart: unless-stopped
    env_file:
      - "./Parking management/.env.example"
    environment:
      DATABASE_URL: postgresql+psycopg2://pms_user:pms_pass@pms-postgres:5432/parkflow
      CORS_ORIGINS: http://localhost:5173,http://localhost:8000,http://localhost:8081
      JWT_SECRET: ${PMS_JWT_SECRET:-pms-dev-jwt-secret-change-in-production}
      PLATFORM_USERINFO_URL: http://iam-service:8000/int/v1/users/me
    expose:
      - "8000"
    depends_on:
      pms-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

  # Direct nginx → app (bypass gateway). Use for debugging only.
  httpd:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/httpd/Dockerfile
    ports:
      - "8001:80"
    depends_on:
      - application

volumes:
  yms_postgres_data:
  pms_postgres_data:
