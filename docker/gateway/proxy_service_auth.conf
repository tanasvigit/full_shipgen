# Strip spoofed service headers from clients; inject gateway-minted JWT only.
proxy_set_header X-Service-Authorization "";
proxy_set_header X-User-Uuid "";
proxy_set_header X-Company-Uuid "";
proxy_set_header X-Service-Authorization $service_auth;
proxy_set_header X-User-Uuid $gateway_user;
proxy_set_header X-Company-Uuid $gateway_company;
