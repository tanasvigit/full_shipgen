# Browser CORS preflight must not run auth_request (no Authorization header on OPTIONS).
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Company, X-Requested-With, X-XSRF-TOKEN" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
}
