<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="shipgen-fleet" />
    <link rel="icon" type="image/png" href="/logo_logistic.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>shipgen-fleet</title>
    <script>
      window.addEventListener(
        "error",
        function (e) {
          if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        },
        true,
      );
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Critical CSS only — Tailwind is not loaded yet; do not use utility classes here -->
    <div id="boot-loader" aria-busy="true" aria-label="Starting up">
      <div class="boot-loader-inner">
        <span class="fleetbase-logo-loader-host" style="width:84px;height:52px" aria-hidden="true">
          <svg class="fleetbase-logo-loader" width="84" height="52" viewBox="0 0 512 320" aria-hidden="true">
            <defs>
              <clipPath id="boot-logo-streaks-clip"><rect x="4" y="68" width="228" height="132" rx="4"></rect></clipPath>
              <clipPath id="boot-logo-swoosh-clip"><path d="M0 198 L512 198 L512 320 L0 320 Z"></path></clipPath>
              <clipPath id="boot-logo-mark-clip"><path d="M188 8 L512 8 L512 210 L188 210 Z"></path></clipPath>
            </defs>
            <g clip-path="url(#boot-logo-swoosh-clip)" class="fleetbase-logo-loader__swoosh">
              <image href="/logo.png" width="512" height="320" preserveAspectRatio="xMidYMid meet"></image>
            </g>
            <g clip-path="url(#boot-logo-streaks-clip)" class="fleetbase-logo-loader__streaks">
              <image href="/logo.png" width="512" height="320" preserveAspectRatio="xMidYMid meet"></image>
            </g>
            <g clip-path="url(#boot-logo-mark-clip)" class="fleetbase-logo-loader__mark">
              <image href="/logo.png" width="512" height="320" preserveAspectRatio="xMidYMid meet"></image>
            </g>
          </svg>
        </span>
        <p class="boot-loader-message">Starting up…</p>
      </div>
    </div>
    <style>
      /* Boot splash — must work before Vite/Tailwind bundle loads */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0;
        background: #f5f6f8;
        box-sizing: border-box;
      }
      #boot-loader .boot-loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        margin: 0;
        padding: 0;
      }
      #boot-loader .boot-loader-message {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.4;
        color: #374151;
        font-family: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      @keyframes fleetbase-logo-streak-flow {
        0%,
        100% {
          transform: translateX(-14px);
          opacity: 0.45;
        }
        50% {
          transform: translateX(16px);
          opacity: 1;
        }
      }
      @keyframes fleetbase-logo-swoosh-flow {
        0%,
        100% {
          transform: translateX(-10px) scaleX(0.98);
          opacity: 0.82;
        }
        50% {
          transform: translateX(18px) scaleX(1.02);
          opacity: 1;
        }
      }
      #boot-loader .fleetbase-logo-loader-host {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
      }
      #boot-loader .fleetbase-logo-loader {
        display: block;
        overflow: visible;
      }
      #boot-loader .fleetbase-logo-loader__streaks {
        transform-box: fill-box;
        transform-origin: 28% 50%;
        animation: fleetbase-logo-streak-flow 0.55s ease-in-out infinite;
      }
      #boot-loader .fleetbase-logo-loader__swoosh {
        transform-box: fill-box;
        transform-origin: 55% 65%;
        animation: fleetbase-logo-swoosh-flow 0.65s ease-in-out infinite;
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
